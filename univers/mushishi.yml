    serie: "Mushishi"
    saison: 0
    episodes: 1

  - titre: "Le Suivant (Saison 2, Partie 1 — Zoku Shou)"
    serie: "Mushishi"
    saison: 2
    episodes: "1-10"

  - titre: "Le Chemin des épines (OVA — Odoro no Michi)"
    serie: "Mushishi"
    saison: 0
    episodes: 2

  - titre: "Le Suivant – Saison 2 (Partie 2 — Zoku Shou 2nd Season)"
