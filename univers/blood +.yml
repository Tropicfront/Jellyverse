# =============================================================
#  UNIVERS : Mushishi
# =============================================================
# Chaque étape doit contenir UNE de ces clés pour être trouvée :
#   serie: "Nom exact dans Jellyfin"   (+ saison / episodes optionnels)
#   film:  "Nom exact dans Jellyfin"
#   id:    "identifiant Jellyfin"      (le plus fiable, voir README)
#
# Options :
#   titre:   texte affiché sur la fiche (libre)
#   saison:  numéro de saison (0 = spéciaux / OVA)
#   episodes: 3  |  [1, 4]  |  "1-10"  |  "1-10, 12"
#   annee:   pour départager deux titres identiques
#   inclure_speciaux: true   (si serie sans saison, inclut la saison 0)
#
# ⚠ Adapte les noms / saisons à la façon dont TA bibliothèque
#   est organisée (regarde les noms exacts dans Jellyfin).
# =============================================================

nom: "Blood + / C"
description: "Ordre de visionnage complet de l'univers Blood + / C."

# Affiche de la collection (facultatif). Sans ce bloc, l'affiche TMDB du
# premier film / série trouvé est utilisée automatiquement.
# affiche:
#   tmdb_serie: 12345          # ou tmdb_film / tmdb_collection (id TMDB)
#   # url: "https://…/affiche.jpg"
#   # fichier: "perso/mushishi.jpg"   (relatif à /affiches)

etapes:
  - titre: "Blood: The Last Vampire"
    film: "Blood: The Last Vampire"

  - titre: "Blood+ (Saison 1 - 50 épisodes)"
    serie: "Blood+"
    saison: 1

  - titre: "Blood-C (Saison 1 - 12 épisodes)"
    serie: "Blood-C"
    saison: 1

  - titre: "Blood-C: The Last Dark"
    film: "Blood-C: The Last Dark"